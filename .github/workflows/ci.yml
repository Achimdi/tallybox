name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run functions:check
      - run: npm run functions:test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx -w web playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Fast check in an in-memory Postgres, the same one used on the developer's machine.
      - run: npm run db:test:local
      # The real thing: Postgres with Supabase's auth schema, in Docker.
      # Applies every migration from scratch, then runs the same test files.
      - run: npx supabase db start
      # On failure, the failing lines also become annotations: the GitHub API
      # shows those without signing in, while job logs need a signed-in account.
      - name: npx supabase test db
        shell: bash
        run: |
          set -o pipefail
          npx supabase test db 2>&1 | tee pgtap.log || {
            grep -E "not ok|# |ERROR|error:|Dubious|FAIL" pgtap.log | head -10 | sed 's/^/::error::/'
            exit 1
          }
